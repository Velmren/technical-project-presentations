<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lottie</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#efe9fb}
#stage{position:absolute;inset:0;container-type:size}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#hog{position:absolute;left:24%;top:27.8%;width:52%;aspect-ratio:640/440}
#hog>div{position:absolute;inset:0;visibility:hidden}
#hog>div.on{visibility:visible}
.pad{position:absolute;left:0;right:0;bottom:3.2%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.pad button{font:500 clamp(10px,1.9cqw,14px)/1 system-ui,sans-serif;padding:.7em 1.15em;border-radius:99px;border:1.5px solid #3b2f63;background:#efe9fb;color:#3b2f63;cursor:pointer}
.pad button:hover{background:#3b2f63;color:#efe9fb}
.pad button[aria-pressed=true]{background:#3b2f63;color:#efe9fb}
.pad button:focus-visible{outline:2px solid #e4572e;outline-offset:2px}
</style>
<div id="stage">
<canvas id="bg"></canvas>
<div id="hog"></div>
<div class="pad" id="pad"></div>
</div>
<script src="lottie_light_canvas.min.js"></script>
<script>
(function () {
  var W = 1000, H = 625, GROUND = 505, S = 520 / 640;
  // ground speed in stage units per second, from the stride of each baked gait (1.42 rig units per comp pixel)
  var STATES = [['run', 'Бег', 'Run', 685 * S], ['walk', 'Шаг', 'Walk', 97 * S], ['idle', 'Ожидание', 'Idle', 0], ['joy', 'Радость', 'Joy', 0], ['sleep', 'Сон', 'Sleep', 0]];
  var en = new URLSearchParams(location.search).get('lang') === 'en';
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hog = document.getElementById('hog'), pad = document.getElementById('pad'), bg = document.getElementById('bg'), ctx = bg.getContext('2d', { alpha: false });
  var anims = {}, boxes = {}, current = 'run', speed = 0, target = STATES[0][3], dist = 0, last = 0, visible = true, raf = 0, firstPainted = false, buttons = {};

  function rng(seed) { var s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  var CYCLE = STATES[0][3] * 1.2;   // ground distance of one baked run cycle; layer periods are multiples of it, so four cycles loop without a jump
  var TREE_P = CYCLE * 2, trees = (function () { var r = rng(9), a = [], x; for (x = 60; x < TREE_P - 60; x += 170 + r() * 110) a.push({ x: x, h: 250 + r() * 120, w: 30 + r() * 16, c: 46 + r() * 24, tone: r() }); return a; })();
  var BUSH_P = CYCLE * 1.6, bushes = (function () { var r = rng(4), a = [], x; for (x = 30; x < BUSH_P - 40; x += 90 + r() * 120) a.push({ x: x, w: 70 + r() * 70, h: 34 + r() * 26 }); return a; })();
  var DASH_P = CYCLE / 3, GRASS_P = CYCLE * 1.35;

  function wrap(v, p) { return ((v % p) + p) % p; }
  function repeat(offset, period, from, to, draw) { var k = Math.floor((from + offset) / period) - 1, x; for (x = k * period - offset; x < to + period; x += period) draw(x); }
  function paint() {
    var w = bg.width, h = bg.height; ctx.setTransform(w / W, 0, 0, h / H, 0, 0);
    ctx.fillStyle = '#efe9fb'; ctx.fillRect(0, 0, W, H);
    // far hills
    var o1 = 0; ctx.fillStyle = '#ddd3f3'; ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (var x = 0; x <= W; x += 20) { var u = (x + o1) / 1000 * 6.2832; ctx.lineTo(x, 330 - 34 * Math.sin(u) - 18 * Math.sin(u * 2 + 1) - 8 * Math.sin(u * 5)); }
    ctx.lineTo(W, GROUND); ctx.fill();
    // trees, a slower layer
    var o2 = dist * .5;
    repeat(o2, TREE_P, 0, W, function (bx) { for (var i = 0; i < trees.length; i++) { var t = trees[i], x2 = bx + t.x;
      if (x2 < -120 || x2 > W + 120) continue;
      ctx.fillStyle = t.tone < .5 ? '#9a82d6' : '#8a72c8'; ctx.fillRect(x2 - t.w / 2, GROUND - t.h, t.w, t.h);
      ctx.fillStyle = t.tone < .5 ? '#b49be8' : '#a68ee0'; ctx.beginPath(); ctx.ellipse(x2, GROUND - t.h - 8, t.c * 1.25, t.c * .8, 0, 0, 7); ctx.fill(); } });
    // grass and the path
    ctx.fillStyle = '#a6d690'; ctx.fillRect(0, GROUND - 38, W, H);
    var o3 = dist * .8; ctx.fillStyle = '#8fc47a';
    repeat(o3, BUSH_P, 0, W, function (bx) { for (var i = 0; i < bushes.length; i++) { var b = bushes[i], x3 = bx + b.x; if (x3 < -120 || x3 > W + 120) continue; ctx.beginPath(); ctx.ellipse(x3, GROUND - 36, b.w / 2, b.h, 0, Math.PI, 0); ctx.fill(); } });
    ctx.fillStyle = '#e9dbb2'; ctx.fillRect(0, GROUND - 18, W, 70);
    ctx.fillStyle = '#d8c796';
    repeat(dist, DASH_P, 0, W, function (dx) { ctx.fillRect(dx + 20, GROUND + 14, 54, 5); ctx.fillRect(dx + 120, GROUND + 33, 38, 4); ctx.beginPath(); ctx.ellipse(dx + 92, GROUND - 4, 7, 4, 0, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#a6d690'; ctx.fillRect(0, GROUND + 52, W, H);
    ctx.fillStyle = '#93c37d';
    repeat(dist * 1.35, GRASS_P, 0, W, function (gx) { for (var k = 0; k < 14; k++) { var bx = gx + 20 + k * (GRASS_P / 14); ctx.beginPath(); ctx.moveTo(bx, GROUND + 100 + (k % 3) * 14); ctx.lineTo(bx + 6, GROUND + 78 + (k % 2) * 8); ctx.lineTo(bx + 12, GROUND + 100 + (k % 3) * 14); ctx.fill(); } });
    // shadow under the hooves
    ctx.fillStyle = 'rgba(70,52,110,.18)'; ctx.beginPath(); ctx.ellipse(W * .5 - 8, GROUND + 3, 190, 16, 0, 0, 7); ctx.fill();
  }
  function resize() {
    var r = bg.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2), w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (w && (w !== bg.width || h !== bg.height)) { bg.width = w; bg.height = h; if (!raf) paint(); }
  }
  function tick(now) {
    raf = 0; if (!visible || document.hidden) { last = 0; return; }
    var dt = last ? Math.min(.05, (now - last) / 1000) : 0; last = now;
    speed += (target - speed) * Math.min(1, dt * 5); dist += speed * dt;
    paint(); if (!firstPainted && anims[current]) { firstPainted = true; try { if (parent !== window) parent.postMessage({ live: location.pathname }, location.origin); } catch (e) {} }
    raf = requestAnimationFrame(tick);
  }
  function run() { if (!raf && visible && !document.hidden && !reduced) raf = requestAnimationFrame(tick); }

  function load(name, then) {
    var a = anims[name];
    if (a) { if (then) { if (a.isLoaded) then(); else a.addEventListener('DOMLoaded', then); } return; }
    var box = document.createElement('div'); hog.appendChild(box); boxes[name] = box;
    a = anims[name] = lottie.loadAnimation({ container: box, renderer: 'canvas', loop: true, autoplay: false, path: '../lottie/' + name + '.json', rendererSettings: { clearCanvas: true } });
    if (then) a.addEventListener('DOMLoaded', then);
  }
  function show(name) {
    current = name;
    for (var k in boxes) boxes[k].className = k === name ? 'on' : '';
    for (var n in anims) { if (n !== name) anims[n].pause(); }
    var a = anims[name]; if (!a) return;
    if (reduced) a.goToAndStop(name === 'run' ? 9 : 0, true); else if (visible) a.play();
    if (!firstPainted && reduced) { firstPainted = true; try { if (parent !== window) parent.postMessage({ live: location.pathname }, location.origin); } catch (e) {} }
  }
  function pick(name) {
    var st = STATES.filter(function (s) { return s[0] === name; })[0]; target = reduced ? 0 : st[3];
    for (var k in buttons) buttons[k].setAttribute('aria-pressed', k === name ? 'true' : 'false');
    current = name; load(name, function () { if (current === name) show(name); });
  }
  STATES.forEach(function (s) { var b = document.createElement('button'); b.type = 'button'; b.textContent = en ? s[2] : s[1]; b.onclick = function () { pick(s[0]); }; pad.appendChild(b); buttons[s[0]] = b; });
  new IntersectionObserver(function (e) { visible = e[0].isIntersecting; if (visible) { var a = anims[current]; if (a && !reduced) a.play(); last = 0; run(); } else { for (var n in anims) anims[n].pause(); } }, { threshold: .05 }).observe(document.getElementById('stage'));
  document.addEventListener('visibilitychange', function () { last = 0; run(); });
  new ResizeObserver(resize).observe(bg); resize(); paint();
  var manual = new URLSearchParams(location.search).get('manual');
  if (manual) { pad.style.display = 'none'; reduced = true; }
  pick('run'); run();
  // recording: draw the run cycle at an exact time
  window.renderAt = function (t) { dist = STATES[0][3] * t; var a = anims.run; a.goToAndStop((t * 30) % 36, true); paint(); };
  window.ready = new Promise(function (ok) { load('run', ok); });
  setTimeout(function () { STATES.forEach(function (s) { if (s[0] !== 'run') load(s[0]); }); }, 2500);
})();
</script>
