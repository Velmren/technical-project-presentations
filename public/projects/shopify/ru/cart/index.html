    <script>
      // The country chosen earlier is applied before the delivery block starts.
      (() => {
        const match = document.cookie.match(/(?:^|; )sheaf_country=([A-Z]{2})/);
        const select = document.querySelector('[data-country-select]');
        if (!match || ![...select.options].some((option) => option.value === match[1])) return;
        select.value = match[1];
        const block = document.querySelector('sheaf-delivery');
        if (!block) return;
        block.dataset.country = match[1];
        block.dataset.countryName = new Intl.DisplayNames([document.documentElement.lang], { type: 'region' }).of(match[1]);
      })();
    </script>
