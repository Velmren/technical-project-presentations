# Server stack for https://shop.velmren.com, installed as /srv/velmren/apps/electronics-store/compose.yaml.
# Env files (mode 600, created by gen-env.sh): .env feeds postgres below; the app gets only app.env
# with the DML-only role shop_app; migrate.env holds the owner role for migrations and admin scripts.
# Uploaded images go to Cloudflare R2 (S3_* in app.env); there is no storage container.
name: electronics-store
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velmren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: electronics
    volumes: ["/srv/velmren/data/electronics-store/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velmren -d electronics"]
      interval: 5s
      timeout: 3s
      retries: 20
    # The entrypoint only needs to chown the data directory and switch to the postgres user.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    pids_limit: 256
    cpus: 1.0
    mem_limit: 384m
  app:
    image: electronics-store:current
    pull_policy: never
    restart: unless-stopped
    # Only the variables the app reads; DATABASE_URL uses shop_app (DML only).
    env_file: app.env
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:3101:3210"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    cpus: 1.5
    mem_limit: 768m
  # Schema migrations and admin scripts under the owner role velmren:
  #   docker compose run --rm -T migrate                      (prisma migrate deploy)
  #   docker compose run --rm -T migrate <command...>         (other scripts that need the owner role)
  migrate:
    image: electronics-store:current
    pull_policy: never
    profiles: [tools]
    env_file: migrate.env
    depends_on:
      postgres: {condition: service_healthy}
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 768m
