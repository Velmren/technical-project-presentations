# Server stack for https://shop.velmren.com, installed as /srv/velmren/apps/electronics-store/compose.yaml.
# Secrets live in the neighbouring .env (mode 600), created by gen-env.sh.
name: electronics-store
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velmren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: electronics
    volumes: ["/srv/velmren/data/electronics-store/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velmren -d electronics"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
  minio:
    # minio/minio images are no longer published; this is the same MinIO release
    # (2025-04-22) packaged by Bitnami, pinned by digest. It runs as uid 1001,
    # so the data directory must be owned by 1001.
    image: bitnamilegacy/minio:2025.4.22-debian-12-r2@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
      MINIO_BROWSER: "off"
      MINIO_SKIP_CLIENT: "yes"
    volumes: ["/srv/velmren/data/electronics-store/minio:/bitnami/minio/data"]
    ports: ["127.0.0.1:3102:9000"]
    healthcheck:
      # The image has neither mc nor curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  app:
    image: electronics-store:current
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports: ["127.0.0.1:3101:3210"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 768m
